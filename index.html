<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e4e3">
  <meta name="description" content="Carlos y Sofía — our little corner of the internet.">
  <title>Carlos y Sofía</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/GreatVibes-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    document.documentElement.classList.add('motion-pending');
    // Never leave the page hidden if loading or animation setup fails.
    window.arrivalFallback = setTimeout(() => {
      document.documentElement.classList.remove('motion-pending');
    }, 5000);
  </script>
  <style>
    @font-face { font-family:'Great Vibes'; src:url('assets/fonts/GreatVibes-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }
    :root { color-scheme:light; --paper:#f2e4e3; --ink:#603f49; --muted:#775c64; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); }
    main { min-height:100svh; padding:40px 24px; display:flex; align-items:center; justify-content:center; }
    .composition { width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; gap:30px; text-align:center; }
    .portrait-wrap { margin:0; width:min(344px,100%); padding:12px 12px 33px; background:#fff9f3; transform:rotate(-2deg); box-shadow:0 2px 5px #603f4914,0 12px 28px #603f4926; }
    .portrait { display:block; width:100%; height:auto; aspect-ratio:3/4; }
    .photo-button { display:block; width:100%; padding:0; border:0; background:transparent; cursor:pointer; touch-action:manipulation; }
    .photo-button:focus-visible { outline:3px solid var(--ink); outline-offset:6px; }
    .music-hint { font:italic 13px/1.5 Georgia,'Times New Roman',serif; color:var(--muted); margin:18px 0 0; }
    .music-hint a { color:inherit; text-underline-offset:3px; }
    .copy { width:100%; }
    h1 { font:400 clamp(64px,8vw,92px)/1.3 'Great Vibes',cursive; margin:0; text-wrap:balance; }
    h1 span { white-space:nowrap; }
    h1 .join { font-size:.7em; }
    .rule { height:1px; width:64px; background:var(--muted); margin:16px auto; }
    .quote { font:italic 18px/1.7 Georgia,'Times New Roman',serif; margin:0; color:var(--muted); text-wrap:balance; }
    @media (max-width:760px) {
      .portrait-wrap { width:min(280px,100%); }
      main { padding-top:36px; }
      h1 { font-size:clamp(56px,13vw,76px); }
    }
    @media (min-width:761px) and (max-height:740px) {
      main { padding:28px 24px; }
      .portrait-wrap { width:220px; padding-bottom:22px; }
      .composition { gap:24px; }
      h1 { font-size:64px; }
    }
    @media (prefers-reduced-motion:no-preference) {
      .motion-pending .portrait-wrap, .motion-pending .copy { opacity:0; }
      .motion-ready .portrait-wrap { animation:portrait-arrival 2.2s cubic-bezier(.2,.65,.3,1) both; }
      .motion-ready .copy { animation:copy-arrival 1.4s ease .65s both; }
      .music-hint:not([hidden]) { animation:music-reveal 1.6s ease both; }
    }
    @keyframes music-reveal {
      from { opacity:0; }
      to { opacity:1; }
    }
    @keyframes portrait-arrival {
      from { opacity:0; transform:translateY(12px) rotate(-2deg); }
      to { opacity:1; transform:translateY(0) rotate(-2deg); }
    }
    @keyframes copy-arrival {
      from { opacity:0; transform:translateY(7px); }
      to { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <div class="composition">
      <figure class="portrait-wrap">
        <button class="photo-button" type="button" aria-label="Play Plaisir d’amour" aria-pressed="false" aria-describedby="music-status">
        <img class="portrait" src="assets/carlos-and-sofia-640.webp" srcset="assets/carlos-and-sofia-320.webp 320w, assets/carlos-and-sofia-640.webp 640w, assets/carlos-and-sofia-960.webp 960w, assets/carlos-and-sofia.webp 1200w" sizes="(max-width:327px) calc(100vw - 72px), (max-width:760px) 256px, (max-height:740px) 196px, 320px" width="1200" height="1600" alt="An illustrated portrait of Carlos and Sofía smiling beneath warm string lights." fetchpriority="high">
        </button>
      </figure>
      <section class="copy" aria-labelledby="names">
        <h1 id="names"><span>Carlos</span> <span class="join">y</span> <span>Sofía</span></h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="quote">Our little corner of the internet.</p>
        <p class="music-hint" id="music-status" role="status" hidden><span aria-hidden="true">♫ </span><span id="music-action">Playing </span><a href="https://archive.org/details/sam-swaap-hmv-c-4842-1-beethoven/03+Sam+Swaap+-+HMV+B+4723+1+Martini+1927.flac" target="_blank" rel="noopener noreferrer">Plaisir d'amour 1927</a></p>
      </section>
    </div>
  </main>
  <audio id="our-song" preload="metadata" src="assets/plaisir-damour-sam-swaap-1927.mp3"></audio>
  <script>
    (() => {
      const button = document.querySelector('.photo-button');
      const audio = document.querySelector('#our-song');
      const status = document.querySelector('#music-status');
      const action = document.querySelector('#music-action');
      let fade;
      let startupTimer;
      let attempt = 0;
      const stopFade = () => clearInterval(fade);
      const message = prefix => {
        action.textContent = prefix;
      };
      const update = playing => {
        button.setAttribute('aria-pressed', String(playing));
        button.setAttribute('aria-label', playing ? 'Pause Plaisir d’amour' : 'Play Plaisir d’amour');
        message(playing ? 'Playing ' : 'Paused ');
      };
      button.hidden = false;
      button.addEventListener('click', async () => {
        status.hidden = false;
        const currentAttempt = ++attempt;
        stopFade();
        clearTimeout(startupTimer);
        button.removeAttribute('aria-busy');
        if (!audio.paused) { audio.pause(); return; }
        button.setAttribute('aria-busy', 'true');
        message('Loading ');
        if (audio.error) audio.load();
        // Start audibly: suspended animation frames must never leave audio muted.
        audio.volume = 0.15;
        startupTimer = setTimeout(() => {
          if (currentAttempt !== attempt) return;
          ++attempt;
          audio.pause();
          button.removeAttribute('aria-busy');
          message('Unable to start ');
        }, 15000);
        try {
          // Call play directly from the tap so mobile browsers permit sound.
          await audio.play();
          if (currentAttempt !== attempt) return;
          const start = performance.now();
          fade = setInterval(() => {
            if (audio.paused) { stopFade(); return; }
            const progress = Math.min((performance.now() - start) / 1800, 1);
            audio.volume = 0.15 + progress * 0.4;
            if (progress === 1) stopFade();
          }, 50);
        } catch (_) {
          if (currentAttempt !== attempt) return;
          update(false);
          message('Unable to start ');
        } finally {
          if (currentAttempt === attempt) {
            clearTimeout(startupTimer);
            button.removeAttribute('aria-busy');
          }
        }
      });
      audio.addEventListener('playing', () => update(true));
      audio.addEventListener('pause', () => { stopFade(); update(false); });
      audio.addEventListener('ended', () => { stopFade(); update(false); message('Finished '); });
      audio.addEventListener('error', () => {
        stopFade(); update(false);
        message('Unable to load ');
      });
    })();
  </script>
  <script>
    (async () => {
      const portrait = document.querySelector('.portrait');
      try {
        await Promise.race([
          Promise.all([portrait.decode(), document.fonts.ready]),
          new Promise(resolve => setTimeout(resolve, 4500))
        ]);
        // If the safety timeout already revealed the page, do not hide it again.
        if (document.documentElement.classList.contains('motion-pending')) {
          document.documentElement.classList.add('motion-ready');
        }
      } catch (_) {
        // Keep all content visible if the image cannot be decoded.
      } finally {
        clearTimeout(window.arrivalFallback);
        document.documentElement.classList.remove('motion-pending');
      }
    })();
  </script>
</body>
</html>
